<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Klipku</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: #111; color: #eee; }
  main { max-width: 760px; margin: 40px auto; padding: 0 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #9a9a9a; margin: 0 0 24px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #f5b301; color: #111; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #2a2a2a; color: #eee; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  td { padding: 8px 6px; border-bottom: 1px solid #262626; vertical-align: top; }
  td:first-child { width: 36px; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .muted { color: #9a9a9a; font-size: 13px; word-break: break-all; }
  pre { background: #1a1a1a; padding: 12px; border-radius: 8px; max-height: 220px; overflow: auto; font-size: 12px; }
  .row { display: flex; gap: 10px; }
</style>
</head>
<body>
<main>
  <h1>Klipku · tes mesin</h1>
  <p class="sub">Milestone 0. Cek semua alat yang ikut di installer jalan dengan Windows Defender tetap aktif.</p>
  <div class="row">
    <button id="run" disabled>Jalankan tes</button>
    <button id="open" class="ghost" disabled>Buka folder hasil</button>
  </div>
  <table id="health"></table>
  <table id="results"></table>
  <details><summary class="muted">Log backend</summary><pre id="log"></pre></details>
</main>
<script src="app.js"></script>
</body>
</html>

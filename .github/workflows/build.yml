name: build-windows

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache download engine
        uses: actions/cache@v4
        with:
          path: .download
          key: engine-${{ hashFiles('scripts/fetch-engine.ps1', 'backend/requirements.txt') }}

      - name: Siapkan engine (python, ffmpeg, deno, yt-dlp, model)
        shell: pwsh
        run: ./scripts/fetch-engine.ps1

      - name: Tes backend dengan python yang dibundel
        shell: pwsh
        run: |
          $env:KLIPKU_ENGINE = "$PWD\engine"
          $env:KLIPKU_OUTPUT = "$PWD\selftest-out"
          & .\engine\python\python.exe -c "import sys; sys.argv=['x']; import server; from fastapi.testclient import TestClient; c=TestClient(server.app); r=c.post('/selftest').json(); [print(('OK  ' if x['ok'] else 'FAIL'), x['test'], '|', x['detail']) for x in r['results']]; sys.exit(0 if r['ok'] else 1)"

      - name: Smoke test pipeline (AI palsu, path aneh, semua format)
        shell: pwsh
        run: |
          $env:KLIPKU_ENGINE = "$PWD\engine"
          & .\engine\python\python.exe scripts\smoke_pipeline.py "$env:RUNNER_TEMP"

      - name: Tes transkrip offline (model tiny + suara SAPI)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $sp = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $wav = "$env:RUNNER_TEMP\speech.wav"
          $sp.SetOutputToWaveFile($wav)
          $sp.Speak("Hello everyone. This is a short test of the offline transcription.")
          $sp.Dispose()
          $env:KLIPKU_ENGINE = "$PWD\engine"
          & .\engine\python\python.exe scripts\test_offline.py $wav

      - name: Install npm
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Klipku-installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @((Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }) + @((Resolve-Path dist\SHA256SUMS.txt).Path))
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Klipku $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Gagal publish GitHub Release $tag" }
